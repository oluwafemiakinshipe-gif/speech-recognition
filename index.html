<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Speech Notes</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>🎤 Speech Notes</h1>

        <p>Click the button and start speaking.</p>

        <button id="startBtn">Start Speaking</button>

        <button id="stopBtn">Stop</button>
        
<button id="newNoteBtn">New Note</button>

        <textarea 
            id="notes"
            placeholder="Your speech will appear here..."
        ></textarea>

        <button id="clearBtn">Clear Notes</button>

    </div>

    <script src="script.js"></script>

</body>
</html>
